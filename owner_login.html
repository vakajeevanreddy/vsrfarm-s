<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - VSR Farm's</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to left, #56ab2f, #a8e063);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ---------- BACKGROUND CIRCLES ---------- */
        .circles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            margin: 0;
            padding: 0;
        }

        .circles li {
            position: absolute;
            display: block;
            list-style: none;
            background: rgba(255, 255, 255, 0.2);
            animation: animate 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }

        .circles li:nth-child(1) { left: 25%; width: 80px; height: 80px; }
        .circles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-duration: 12s; }
        .circles li:nth-child(3) { left: 70%; width: 20px; height: 20px; }
        .circles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-duration: 18s; }
        .circles li:nth-child(5) { left: 65%; width: 20px; height: 20px; }
        .circles li:nth-child(6) { left: 75%; width: 110px; height: 110px; }
        .circles li:nth-child(7) { left: 35%; width: 150px; height: 150px; }
        .circles li:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-duration: 45s; }
        .circles li:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-duration: 35s; }
        .circles li:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-duration: 11s; }

        @keyframes animate {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }

        /* ---------- LOGIN CARD ---------- */
        .login-container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 1;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.2),
                inset 0 0 0 1px rgba(255, 255, 255, 0.6);

            transform: translateY(40px) scale(0.95);
            opacity: 0;
            animation:
                slideUpFade 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
                floatCard 6s ease-in-out infinite;

            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .login-container::before {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 22px;
            background: linear-gradient(
                120deg,
                rgba(39, 174, 96, 0.6),
                rgba(46, 204, 113, 0.2),
                rgba(39, 174, 96, 0.6)
            );
            filter: blur(18px);
            z-index: -1;
            animation: glowPulse 4s ease-in-out infinite;
        }

        .login-container:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 45px 120px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideUpFade {
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ---------- TEXT ---------- */
        h2 {
            margin: 15px 0 5px;
            font-size: 2rem;
            color: #2c3e50;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        /* ---------- FORM ---------- */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 0.9rem;
            color: #34495e;
            margin-bottom: 6px;
            display: block;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            background: rgba(249, 249, 249, 0.9);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.25);
        }

        /* ---------- BUTTON ---------- */
        .login-btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(39, 174, 96, 0.4);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        /* ---------- ERROR ---------- */
        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            display: none;
            font-size: 0.9rem;
        }

        /* ---------- SUCCESS OVERLAY ---------- */
        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .success-icon {
            font-size: 5rem;
            color: #27ae60;
            animation: pop 0.5s ease forwards;
        }

        @keyframes pop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
    </style>
</head>

<body>

    <ul class="circles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="login-container">
        <i class="fas fa-user-shield" style="font-size:3rem;color:#27ae60;"></i>
        <h2>Welcome Back</h2>
        <p class="subtitle">Please login to your owner account</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <button class="login-btn" type="submit">Sign In</button>
            <p class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i> Invalid Email or Password
            </p>
        </form>
    </div>

    <div class="success-overlay" id="successOverlay">
        <i class="fas fa-check-circle success-icon"></i>
        <h2>Login Successful</h2>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('errorMessage');
            const success = document.getElementById('successOverlay');

            if (email === "vsrmilkproducts@gmail.com" && password === "Welcome@123") {
                error.style.display = "none";
                success.style.display = "flex";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2500);
            } else {
                error.style.display = "block";
            }
        });
    </script>

</body>
</html>
