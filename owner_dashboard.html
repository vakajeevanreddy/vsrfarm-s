<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - VSR Farm's</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .bg-blue {
            background: #3498db;
        }

        .bg-green {
            background: #2ecc71;
        }

        .bg-orange {
            background: #e67e22;
        }

        .stat-info h3 {
            margin: 0;
            font-size: 2rem;
            color: #333;
        }

        .stat-info p {
            margin: 0;
            color: #777;
            font-size: 0.9rem;
        }

        .section-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .data-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .data-card h3 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            color: #7f8c8d;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: #e8f8f5;
            color: #27ae60;
        }

        .view-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f9f9f9;
        }

        .view-count {
            background: #eee;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="margin: 0;"><i class="fas fa-chart-line"></i> Owner Dashboard</h1>
            <button onclick="logoutOwner()" style="padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.3s;"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <!-- Top Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon bg-blue"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <h3 id="totalCustomers">0</h3>
                    <p>Total Customers</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-green"><i class="fas fa-shopping-bag"></i></div>
                <div class="stat-info">
                    <h3 id="totalOrders">0</h3>
                    <p>Total Orders</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-orange"><i class="fas fa-rupee-sign"></i></div>
                <div class="stat-info">
                    <h3 id="totalSales">0</h3>
                    <p>Total Revenue</p>
                </div>
            </div>
        </div>

        <div class="section-grid">
            <!-- Recent Orders -->
            <div class="data-card">
                <h3>Recent Orders</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable">
                        <tr>
                            <td colspan="4">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Product Views -->
            <div class="data-card">
                <h3>Most Viewed Products</h3>
                <ul class="view-list" id="viewsList" style="list-style: none; padding: 0;">
                    <li>Loading...</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Logout Logic to clear session
        function logoutOwner() {
            localStorage.removeItem('vsr_owner_active');
            window.location.href = 'owner_login.html';
        }

        async function fetchStats() {
            try {
                const res = await fetch('http://localhost:5000/api/admin/stats');
                const data = await res.json();

                // Update Stats
                document.getElementById('totalCustomers').innerText = data.totalCustomers;
                document.getElementById('totalOrders').innerText = data.totalOrders;
                document.getElementById('totalSales').innerText = '₹' + data.totalSales;

                // Update Orders Table
                const ordersHtml = data.recentOrders.map(order => `
                    <tr>
                        <td>${order.customerName || 'Guest'}</td>
                        <td>₹${order.totalAmount}</td>
                        <td><span class="status-badge">${order.status}</span></td>
                        <td>${new Date(order.createdAt).toLocaleDateString()}</td>
                    </tr>
                `).join('');
                document.getElementById('ordersTable').innerHTML = ordersHtml || '<tr><td colspan="4">No orders yet</td></tr>';

                // Update Views List
                const viewsHtml = data.productViews.map(view => `
                    <li>
                        <span>${view._id}</span>
                        <span class="view-count">${view.count} views</span>
                    </li>
                `).join('');
                document.getElementById('viewsList').innerHTML = viewsHtml || '<li>No activity yet</li>';

            } catch (err) {
                console.error("Failed to fetch stats", err);
            }
        }

        fetchStats();
        // Refresh every 30 seconds
        setInterval(fetchStats, 30000);
    </script>
</body>

</html>
